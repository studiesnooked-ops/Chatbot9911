[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ============= BOT PROCESS =============
[program:telegram_bot]
directory=/app
command=python3 main.py
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/app/logs/bot.log
stderr_logfile=/app/logs/bot_error.log
priority=999

# Restart policy
retry_count=5
retry_delay=10

# Environment
environment=PATH="/usr/local/bin:/usr/bin:/bin"

# ============= FLASK SERVER PROCESS =============
[program:flask_server]
directory=/app
command=gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 30 --access-logfile /app/logs/flask_access.log --error-logfile /app/logs/flask_error.log app:app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/app/logs/flask.log
stderr_logfile=/app/logs/flask_error.log
priority=998

# Environment
environment=PATH="/usr/local/bin:/usr/bin:/bin"

# ============= GROUP =============
[group:bot_services]
programs=telegram_bot,flask_server
priority=999
